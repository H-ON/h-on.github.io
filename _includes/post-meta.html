<div class="post-meta">
  {% for category in include.post.categories %}
    {% assign topic = site.data.topics | where: 'slug', category | first %}
    {% if topic %}
      <a class="pill" href="{{ topic.url | relative_url }}">{{ topic.name | escape }}</a>
    {% else %}
      <span class="pill">{{ category | escape }}</span>
    {% endif %}
  {% endfor %}
  <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%Y.%m.%d' }}</time>
</div>
