<a class="skip-link" href="#main-content">본문으로 이동</a>
<header class="site-header">
  <div class="wrapper header-inner">
    <a class="brand" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>
      <span class="brand-mark" aria-hidden="true">H</span> {{ site.title | escape }}
    </a>
    <nav class="nav-links" aria-label="주 메뉴">
      {% for path in site.header_pages %}
        {% assign item = site.pages | where: 'path', path | first %}
        {% if item.title %}
          <a href="{{ item.url | relative_url }}"{% if item.url == page.url %} aria-current="page"{% endif %}>{{ item.title | escape }}</a>
        {% endif %}
      {% endfor %}
    </nav>
    <a class="header-search" href="{{ '/blog/' | relative_url }}#search">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>
      검색
    </a>
  </div>
</header>
