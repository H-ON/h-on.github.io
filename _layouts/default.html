<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'ko' | escape }}">
  {% include head.html %}
  <body>
    {% include header.html %}
    <main id="main-content" tabindex="-1">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="wrapper footer-inner">
        <div>
          <a class="footer-brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
          <p>{{ site.description | escape }}</p>
        </div>
        <nav aria-label="하단 메뉴">
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
          <a href="https://github.com/H-ON">GitHub</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
